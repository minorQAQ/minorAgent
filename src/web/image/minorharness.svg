  <!-- 主字标 minor：奶油白衬线 -->
  <text x="212" y="65" text-anchor="middle" textLength="140" lengthAdjust="spacingAndGlyphs" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="49" font-weight="700" letter-spacing="0.5" fill="url(#cream)" filter="url(#creamShadow)">minor</text>

  <!-- 右上角小号徽章：可可色哑光，奶油文字 -->
  <g>
    <rect x="278" y="13" width="50" height="19" rx="6" fill="#3b3326" fill-opacity="0.92"/>
    <rect x="278.5" y="13.5" width="49" height="18" rx="5.5" fill="none" stroke="#f6efdd" stroke-opacity="0.35" stroke-width="1"/>
  </g>
  <text x="303" y="26" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.8" fill="#efe6d0">agent</text>
</svg>
