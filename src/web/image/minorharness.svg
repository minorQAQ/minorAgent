<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" width="340" height="96" role="img" aria-label="minor agent">
  <!-- minor agent 品牌标：透明底 + 奶油色调（暖白字标 + 可可色毛玻璃徽章） -->
  <defs>
    <!-- 奶油白渐变（无高光带，柔和平缓） -->
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="0.6" stop-color="#f6efdc"/>
      <stop offset="1" stop-color="#e9e2cd"/>
    </linearGradient>
    <!-- 奶油字标柔和暖影，保证浅/深底均可读 -->
    <filter id="creamShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.4" flood-color="#7a6242" flood-opacity="0.4"/>
    </filter>
  </defs>

