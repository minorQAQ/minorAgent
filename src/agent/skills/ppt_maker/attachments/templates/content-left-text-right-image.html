<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- CUSTOMIZE: 修改页面标题 -->
<title>内容 - 左文右图</title>
<style>
:root {
  /* CUSTOMIZE: 替换为 spec_lock.md 中定义的调色板 */
  --bg: #FAFBFC;
  --primary: #1E293B;
  --secondary: #F1F5F9;
  --accent: #D97706;
  --text: #0F172A;
  --muted: #64748B;
  --card-bg: #FFFFFF;
  --card-shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --border-color: #E2E8F0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1280px;
  height: 720px;
  overflow: hidden;
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
}

.page {
  width: 1280px;
  height: 720px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  padding: 60px 80px;
}

/* 左侧文本区域 */
.text-block {
  flex: 0 0 540px;
  padding-right: 50px;
}

.text-block h2 {
  font-size: 32px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 24px;
  line-height: 1.3;
}

.text-block .text-body {
  font-size: 16px;
  font-weight: 400;
  color: var(--muted);
  line-height: 1.8;
  margin-bottom: 28px;
}

/* 要点列表 */
.text-block .point-list {
  list-style: none;
}

.text-block .point-list li {
  font-size: 16px;
  font-weight: 400;
  color: var(--text);
  line-height: 1.6;
  margin-bottom: 14px;
  padding-left: 24px;
  position: relative;
}

.text-block .point-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 8px;
  width: 8px;
  height: 8px;
  background: var(--accent);
  border-radius: 2px;
  transform: rotate(45deg);
}

/* 右侧图片区域 */
.image-block {
  flex: 0 0 660px;
  height: 560px;
  position: relative;
}

/* CUSTOMIZE: 替换图片路径 */
.image-block .placeholder {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
}

.image-block .placeholder-content {
  color: var(--muted);
  font-size: 16px;
  text-align: center;
  opacity: 0.5;
}

/* 图片标签 */
.image-block .img-caption {
  position: absolute;
  bottom: -28px;
  right: 0;
  font-size: 13px;
  color: var(--muted);
  opacity: 0.6;
}
</style>
</head>
<body>
<!-- CUSTOMIZE: 修改此模板以匹配你的 spec_lock.md 内容 -->

<div class="page">
  <div class="text-block">
    <!-- CUSTOMIZE: 替换为实际标题 -->
    <h2 data-anim="fade-up" data-anim-duration="0.6s">
      内容标题：核心观点阐述
    </h2>

    <!-- CUSTOMIZE: 替换为实际正文 -->
    <p class="text-body" data-anim="fade-up" data-anim-duration="0.6s" data-anim-delay="0.15">
      此处为正文段落内容，用于详细阐述本页的核心观点和论据。
      支持多段落组织和要点列表呈现，确保信息层次分明、可读性强。
    </p>

    <!-- CUSTOMIZE: 替换为实际要点 -->
    <ul class="point-list" data-anim="fade-up" data-anim-duration="0.6s" data-anim-delay="0.3">
      <li>关键要点一：简洁表达核心发现或结论</li>
      <li>关键要点二：数据支撑或论据补充</li>
      <li>关键要点三：行动建议或后续方向</li>
    </ul>
  </div>

  <div class="image-block">
    <!-- CUSTOMIZE: 替换为实际图片 -->
    <div class="placeholder">
      <!-- CUSTOMIZE: 将此 div 替换为 <img src="your-image.png" alt="配图" class="placeholder"> -->
      <span class="placeholder-content">图片占位区域<br>660 × 560</span>
    </div>
    <!-- CUSTOMIZE: 替换图片说明文字 -->
    <span class="img-caption">图片来源说明</span>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var els = document.querySelectorAll('[data-anim]');
  els.forEach(function(el, i){
    el.style.opacity = '0';
    var anim = el.getAttribute('data-anim');
    if (anim === 'fade-up') el.style.transform = 'translateY(30px)';
    else if (anim === 'scale-in') el.style.transform = 'scale(0.85)';
    else if (anim === 'slide-left') el.style.transform = 'translateX(-60px)';
    else if (anim === 'slide-right') el.style.transform = 'translateX(60px)';
    else if (anim === 'zoom-in') el.style.transform = 'scale(0.5)';
    el.style.transition = 'opacity '+(el.getAttribute('data-anim-duration')||'0.6s')+' '+(el.getAttribute('data-anim-easing')||'cubic-bezier(0.34,1.56,0.64,1)')+', transform '+(el.getAttribute('data-anim-duration')||'0.6s')+' '+(el.getAttribute('data-anim-easing')||'cubic-bezier(0.34,1.56,0.64,1)');
  });
  function animStagger(parent, gap){
    var children = Array.from(parent.children).filter(function(c){ return c.hasAttribute('data-anim'); });
    children.forEach(function(c, i){
      var delay = parseFloat(c.getAttribute('data-anim-delay')||'0');
      setTimeout(function(){ c.classList.add('anim-visible'); c.style.opacity = '1'; c.style.transform = 'none'; }, (i * (gap||80)) + delay*1000);
    });
  }
  function animSequence(parent, gap){
    var children = Array.from(parent.children).filter(function(c){ return c.hasAttribute('data-anim'); });
    var totalDelay = 0;
    children.forEach(function(c){
      setTimeout(function(){ c.classList.add('anim-visible'); c.style.opacity = '1'; c.style.transform = 'none'; }, totalDelay);
      totalDelay += (gap||80);
    });
  }
  function triggerClickGroup(group){
    var groupEls = document.querySelectorAll('[data-anim-click-group="'+group+'"]');
    groupEls.forEach(function(el, i){
      setTimeout(function(){ el.classList.add('anim-visible'); el.style.opacity = '1'; el.style.transform = 'none'; }, i*60);
    });
  }
  setTimeout(function(){
    els.forEach(function(el){
      if (!el.closest('[data-anim-stagger]') && !el.closest('[data-anim-sequence]') && !el.getAttribute('data-anim-click-group')){
        var delay = parseFloat(el.getAttribute('data-anim-delay')||'0') * 1000;
        setTimeout(function(){ el.classList.add('anim-visible'); el.style.opacity = '1'; el.style.transform = 'none'; }, delay);
      }
    });
    document.querySelectorAll('[data-anim-stagger]').forEach(function(p){ animStagger(p, 80); });
    document.querySelectorAll('[data-anim-sequence]').forEach(function(p){ animSequence(p, 300); });
  }, 100);
});
</script>
</body>
</html>
