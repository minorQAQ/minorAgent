<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- CUSTOMIZE: 修改页面标题 -->
<title>封面 - Split</title>
<style>
:root {
  /* CUSTOMIZE: 替换为 spec_lock.md 中定义的调色板 */
  --bg: #FAFBFC;
  --primary: #1E293B;
  --secondary: #F1F5F9;
  --accent: #D97706;
  --text: #0F172A;
  --muted: #64748B;
  --card-bg: #FFFFFF;
  --card-shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --border-color: #E2E8F0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1280px;
  height: 720px;
  overflow: hidden;
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
}

.page {
  width: 1280px;
  height: 720px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  padding: 0 80px;
}

/* 左侧文本区域 */
.text-block {
  flex: 0 0 540px;
  padding-right: 60px;
}

.text-block .tag {
  display: inline-block;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 20px;
  padding: 4px 12px;
  border: 1px solid var(--accent);
  border-radius: 4px;
}

.text-block h1 {
  font-size: 44px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.25;
  margin-bottom: 20px;
}

.text-block .subtitle {
  font-size: 18px;
  font-weight: 400;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 36px;
}

.text-block .meta {
  font-size: 15px;
  color: var(--muted);
  letter-spacing: 0.04em;
}

/* 右侧图片区域 */
.image-block {
  flex: 0 0 660px;
  height: 540px;
  position: relative;
}

/* CUSTOMIZE: 替换图片路径 */
.image-block .placeholder {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  display: flex;
  align-items: center;
  justify-content: center;
}

.image-block .placeholder-content {
  color: var(--muted);
  font-size: 16px;
  text-align: center;
  opacity: 0.5;
}

/* 右侧图片区域的装饰边框 */
.image-block::before {
  content: '';
  position: absolute;
  top: -12px;
  right: -12px;
  width: 120px;
  height: 120px;
  border-top: 3px solid var(--accent);
  border-right: 3px solid var(--accent);
  border-radius: 0 16px 0 0;
}
</style>
</head>
<body>
<!-- CUSTOMIZE: 修改此模板以匹配你的 spec_lock.md 内容 -->

<div class="page">
  <div class="text-block">
    <!-- CUSTOMIZE: 替换标签文本 -->
    <span class="tag" data-anim="fade-up" data-anim-duration="0.6s">项目标签</span>

    <!-- CUSTOMIZE: 替换为实际标题 -->
    <h1 data-anim="fade-up" data-anim-duration="0.8s" data-anim-delay="0.2">
      演示文稿<br>主标题
    </h1>

    <!-- CUSTOMIZE: 替换为实际副标题 -->
    <p class="subtitle">
      副标题或一句话简介说明核心主题
    </p>

    <!-- CUSTOMIZE: 替换为实际作者信息 -->
    <p class="meta">作者姓名  |  2025 年 1 月</p>
  </div>

  <div class="image-block" data-anim="fade-up" data-anim-duration="0.8s" data-anim-delay="0.4">
    <!-- CUSTOMIZE: 替换为实际图片 <img> 标签 -->
    <div class="placeholder">
      <!-- CUSTOMIZE: 将此 div 替换为 <img src="your-image.png" alt="封面图" class="placeholder"> -->
      <span class="placeholder-content">图片占位区域<br>660 × 540</span>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var els = document.querySelectorAll('[data-anim]');
  els.forEach(function(el, i){
    el.style.opacity = '0';
    var anim = el.getAttribute('data-anim');
    if (anim === 'fade-up') el.style.transform = 'translateY(30px)';
    else if (anim === 'scale-in') el.style.transform = 'scale(0.85)';
    else if (anim === 'slide-left') el.style.transform = 'translateX(-60px)';
    else if (anim === 'slide-right') el.style.transform = 'translateX(60px)';
    else if (anim === 'zoom-in') el.style.transform = 'scale(0.5)';
    el.style.transition = 'opacity '+(el.getAttribute('data-anim-duration')||'0.6s')+' '+(el.getAttribute('data-anim-easing')||'cubic-bezier(0.34,1.56,0.64,1)')+', transform '+(el.getAttribute('data-anim-duration')||'0.6s')+' '+(el.getAttribute('data-anim-easing')||'cubic-bezier(0.34,1.56,0.64,1)');
  });
  function animStagger(parent, gap){
    var children = Array.from(parent.children).filter(function(c){ return c.hasAttribute('data-anim'); });
    children.forEach(function(c, i){
      var delay = parseFloat(c.getAttribute('data-anim-delay')||'0');
      setTimeout(function(){ c.classList.add('anim-visible'); c.style.opacity = '1'; c.style.transform = 'none'; }, (i * (gap||80)) + delay*1000);
    });
  }
  function animSequence(parent, gap){
    var children = Array.from(parent.children).filter(function(c){ return c.hasAttribute('data-anim'); });
    var totalDelay = 0;
    children.forEach(function(c){
      setTimeout(function(){ c.classList.add('anim-visible'); c.style.opacity = '1'; c.style.transform = 'none'; }, totalDelay);
      totalDelay += (gap||80);
    });
  }
  function triggerClickGroup(group){
    var groupEls = document.querySelectorAll('[data-anim-click-group="'+group+'"]');
    groupEls.forEach(function(el, i){
      setTimeout(function(){ el.classList.add('anim-visible'); el.style.opacity = '1'; el.style.transform = 'none'; }, i*60);
    });
  }
  setTimeout(function(){
    els.forEach(function(el){
      if (!el.closest('[data-anim-stagger]') && !el.closest('[data-anim-sequence]') && !el.getAttribute('data-anim-click-group')){
        var delay = parseFloat(el.getAttribute('data-anim-delay')||'0') * 1000;
        setTimeout(function(){ el.classList.add('anim-visible'); el.style.opacity = '1'; el.style.transform = 'none'; }, delay);
      }
    });
    document.querySelectorAll('[data-anim-stagger]').forEach(function(p){ animStagger(p, 80); });
    document.querySelectorAll('[data-anim-sequence]').forEach(function(p){ animSequence(p, 300); });
  }, 100);
});
</script>
</body>
</html>
